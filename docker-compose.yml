services:
  app:
    build: .
    container_name: gitbot-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - SITE_URL=${SITE_URL}
      - MONGO_URI=mongodb://mongo:27017/gitbot
      - REDIS_URL=redis://redis:6379
      - DISCORD_APP_TOKEN=${DISCORD_APP_TOKEN}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY}
      - GITHUB_CLIENT_NAME=${GITHUB_CLIENT_NAME:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ADMIN_DISCORD_IDS=${ADMIN_DISCORD_IDS:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: gitbot-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gitbot-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
  redis_data:
